services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horaria
      POSTGRES_USER: horaria
      POSTGRES_PASSWORD: horaria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horaria -d horaria"]
      interval: 10s
      timeout: 5s
      retries: 5

  optimizer:
    build:
      context: ./optimizer
    ports:
      - "8000:8000"

  web:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://horaria:horaria@postgres:5432/horaria?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      OPTIMIZER_URL: http://optimizer:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    command: sh -c "npx prisma db push && npm run prisma:seed && npm run start"

volumes:
  postgres-data:
